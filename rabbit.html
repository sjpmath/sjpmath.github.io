            /* Masonry-style collage: photos keep their own shape */
            .rabbit-collage {
                column-count: 3;
                column-gap: 0.75rem;
            }
            .rabbit-collage a {
                display: block;
                margin-bottom: 0.75rem;
                break-inside: avoid;
                border-radius: 8px;
                overflow: hidden;
            }
            .rabbit-collage img {
                width: 100%;
                height: auto;
                display: block;
                transition: transform 0.25s ease;
            }
            .rabbit-collage a:hover img {
                transform: scale(1.04);
            }
            @media (max-width: 992px) { .rabbit-collage { column-count: 2; } }
            @media (max-width: 480px) { .rabbit-collage { column-count: 1; } }
            .rabbit-divider {

                border-top: 1px solid #ced4da;
